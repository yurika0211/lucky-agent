name: Action bot

on:
  schedule:
    - cron: "20 1 * * *"
  pull_request:
    paths:
      - ".github/workflows/action-bot.yml"
      - "scripts/action_bot.py"
      - "scripts/benchstat_json.py"
      - "agent/checkpoint_persistence_test.go"
      - "packages/luckyagent-orchestrator/autonomy/persistence_benchmark_test.go"
  workflow_dispatch:
    inputs:
      issue:
        description: "Digest issue number"
        required: false
        default: "342"

permissions:
  contents: read
  issues: write

concurrency:
  group: action-bot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  performance:
    name: Checkpoint and queue benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Benchmark selected packages
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          bench() {
            local module="$1" pattern="$2" output="$3"
            shift 3
            (
              cd "$module"
              go test -mod=readonly -run '^$' -bench "$pattern" \
                -benchtime=1x -count=1 -timeout 15m -json "$@"
            ) > "$output.raw"
            python3 scripts/benchstat_json.py --output "$output" < "$output.raw"
          }
          bench agent 'BenchmarkCheckpointTrajectory$' checkpoint-bench.json .
          bench packages/luckyagent-orchestrator 'BenchmarkQueue(SnapshotEncoding|PersistLock)$' queue-bench.json ./autonomy
      - name: Combine benchmark summary
        run: |
          python3 - <<'PY'
          import json
          rows = []
          for path in ("checkpoint-bench.json", "queue-bench.json"):
              rows.extend(json.load(open(path, encoding="utf-8")))
          if not rows:
              raise SystemExit("performance summary is empty")
          json.dump(rows, open("perf-summary.json", "w", encoding="utf-8"), indent=2)
          print(f"recorded {len(rows)} benchmark rows")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-summary
          path: |
            perf-summary.json
            checkpoint-bench.json
            queue-bench.json
          if-no-files-found: warn

  digest:
    name: Post maintenance digest
    runs-on: ubuntu-latest
    needs: performance
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: performance-summary
      - name: Comment issue digest
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.inputs.issue || '342' }}
        run: python3 scripts/action_bot.py --issue "$ISSUE" --bench perf-summary.json
      - name: Preview issue digest
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/action_bot.py --issue 342 --bench perf-summary.json --dry-run
