name: CI

on:
  push:
    branches: [master, dev-*]
    tags:
      - '*'
  pull_request:
    branches: [master, dev-*]
    types: [opened, synchronize, reopened, ready_for_review]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/yurika0211/luckyagent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Download dependencies
        run: go mod download
      - name: Release manifest and installer contracts
        run: python3 -m unittest discover -s scripts -p test_release_integrity.py
      - name: Verify Agent graph audit
        env:
          EVENT_REF: ${{ github.ref }}
        run: |
          python3 -m unittest discover -s scripts -p test_agent_graph_parity.py
          if [[ "$EVENT_REF" == refs/tags/* ]]; then
            python3 scripts/verify-agent-graph.py --output ci-agent-graph.json
          else
            python3 scripts/verify-agent-graph.py --report-only --output ci-agent-graph.json
          fi
      - name: Retain selected Agent graph evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-graph-parity
          path: ci-agent-graph.json
          if-no-files-found: error
      - name: Agent request and completion contracts
        run: python3 scripts/run-agent-contracts.py leaf
      - name: Launcher-selected graph contracts
        run: python3 scripts/run-agent-contracts.py workspace
      - name: Published graph release contracts
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/run-agent-contracts.py published
      - name: Test Agent module
        working-directory: agent
        env:
          GOWORK: off
        run: |
          go test -mod=readonly -race -count=1 ./...
          go vet ./...
      - name: Run tests
        run: go test ./... -race -count=1 -timeout 10m
      - name: Launcher end-to-end
        run: go test -tags e2e -count=1 -timeout 8m ./e2e
      - name: Build
        run: |
          test "$(go list -f '{{.Dir}}' github.com/yurika0211/lucky-agent/agent)" = "$PWD/agent"
          go build -o lh ./cmd/la
      - name: Build published dependency graph
        env:
          GOWORK: off
        run: go build -mod=readonly -o /tmp/lh-pinned ./cmd/la
      - name: Verify binary
        run: ./lh version
      - name: Smoke release archive layout
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ci-release
          mkdir -p .ci-release/extract
          bash scripts/prepare-release-bundle.sh .ci-release/dist ./lh
          tar -czf .ci-release/lh-linux-amd64.tar.gz -C .ci-release/dist .
          tar -xzf .ci-release/lh-linux-amd64.tar.gz -C .ci-release/extract
          test -x .ci-release/extract/lh
          test -x .ci-release/extract/install.sh
          test ! -e .ci-release/extract/UI
          test ! -e .ci-release/extract/runtime

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
