name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  contracts:
    name: Agent release contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod download
      - name: Require source and selected Agent equality
        run: python3 scripts/verify-agent-graph.py
      - name: Verify source request and completion contracts
        run: python3 scripts/run-agent-contracts.py leaf
      - name: Verify published launcher graph contracts
        run: python3 scripts/run-agent-contracts.py published
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    needs: contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            artifact_name: lh-linux-amd64
            archive_name: lh-linux-amd64.tar.gz
            binary_name: lh
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            artifact_name: lh-linux-arm64
            archive_name: lh-linux-arm64.tar.gz
            binary_name: lh
          - runner: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: lh-windows-amd64
            archive_name: lh-windows-amd64.zip
            binary_name: lh.exe
          - runner: macos-14
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
            artifact_name: lh-darwin-amd64
            archive_name: lh-darwin-amd64.tar.gz
            binary_name: lh
          - runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang -arch arm64
            artifact_name: lh-darwin-arm64
            archive_name: lh-darwin-arm64.tar.gz
            binary_name: lh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "dist/${{ matrix.binary_name }}" ./cmd/la

      - name: Build binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "dist/${{ matrix.binary_name }}" ./cmd/la

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="dist/release-root"
          bash scripts/prepare-release-bundle.sh "$stage" "dist/${{ matrix.binary_name }}"
          test -x "$stage/lh"
          test -x "$stage/install.sh"
          test ! -e "$stage/UI"
          test ! -e "$stage/runtime"
          tar -czf "${{ matrix.archive_name }}" -C "$stage" .
          if [[ "${{ matrix.goos }}" == "linux" ]]; then
            bash scripts/build-linux-deb.sh "${{ github.ref_name }}" "${{ matrix.goarch }}" "$stage" dist
            ls dist/*.deb >/dev/null
          else
            bash scripts/build-macos-installer.sh "${{ github.ref_name }}" "${{ matrix.goarch }}" "$stage" dist
            ls dist/*.pkg >/dev/null
          fi

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/build-windows-installer.ps1 -Version $env:VERSION
          if (-not (Test-Path "dist\windows-installer\lh.exe")) {
            throw "Windows installer stage is missing lh.exe"
          }
          if (-not (Get-ChildItem "dist\LuckyAgent-Setup-*.exe")) {
            throw "Windows setup exe was not produced"
          }
          Compress-Archive -Path "dist/windows-installer/*" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.archive_name }}
            dist/LuckyAgent-Setup-*.exe
            dist/*.deb
            dist/*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate update manifest
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import quote

          tag = os.environ["RELEASE_TAG"]
          root = Path("release-assets")
          assets = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.name == "update.json":
                  continue
              assets.append({
                  "name": path.name,
                  "download_url": f"https://github.com/yurika0211/lucky-agent/releases/download/{quote(tag, safe='')}/{quote(path.name, safe='')}",
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })
          if not assets:
              raise SystemExit("no release assets found")
          # This workflow runs on tag pushes, before the release object exists.
          published = os.environ.get("RELEASE_PUBLISHED_AT", "").strip() or datetime.now(timezone.utc).isoformat()
          manifest = {
              "schema": 1,
              "tag_name": tag,
              "html_url": f"https://github.com/yurika0211/lucky-agent/releases/tag/{tag}",
              "published_at": published,
              "assets": assets,
          }
          (root / "update.json").write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
