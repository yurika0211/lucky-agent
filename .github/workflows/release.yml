name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  NODE_VERSION: '22.22.2'

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cc: gcc
            artifact_name: lh-linux-amd64
            archive_name: lh-linux-amd64.tar.gz
            binary_name: lh
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cc: gcc
            artifact_name: lh-linux-arm64
            archive_name: lh-linux-arm64.tar.gz
            binary_name: lh
          - runner: windows-latest
            goos: windows
            goarch: amd64
            artifact_name: lh-windows-amd64
            archive_name: lh-windows-amd64.zip
            binary_name: lh.exe
          - runner: macos-14
            goos: darwin
            goarch: amd64
            cc: clang -arch x86_64
            artifact_name: lh-darwin-amd64
            archive_name: lh-darwin-amd64.tar.gz
            binary_name: lh
          - runner: macos-14
            goos: darwin
            goarch: arm64
            cc: clang -arch arm64
            artifact_name: lh-darwin-arm64
            archive_name: lh-darwin-arm64.tar.gz
            binary_name: lh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-toolchain

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - name: Build bundled GUI and TUI
        if: runner.os != 'Windows'
        shell: bash
        working-directory: UI
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build bundled GUI and TUI
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: UI
        run: |
          npm ci
          npm run build

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "dist/${{ matrix.binary_name }}" ./cmd/la

      - name: Build binary
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          DATE: ${{ github.event.head_commit.timestamp || github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=${DATE}" -o "dist/${{ matrix.binary_name }}" ./cmd/la

      - name: Package release archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$(dirname "$(command -v node)")"
          node_root="$(cd "$node_bin/.." && pwd)"
          stage="dist/release-root"
          bash scripts/prepare-release-bundle.sh "$stage" "dist/${{ matrix.binary_name }}" "$node_root"
          tar -czf "${{ matrix.archive_name }}" -C "$stage" .
          if [[ "${{ matrix.goos }}" == "linux" ]]; then
            bash scripts/build-linux-deb.sh "${{ github.ref_name }}" "${{ matrix.goarch }}" "$stage" dist
          else
            bash scripts/build-macos-installer.sh "${{ github.ref_name }}" "${{ matrix.goarch }}" "$stage" dist
          fi

      - name: Package release archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $nodeRoot = Split-Path -Parent (Get-Command node).Source
          ./scripts/build-windows-installer.ps1 -Version $env:VERSION -NodeRuntimeRoot $nodeRoot
          Compress-Archive -Path "dist/windows-installer/*" -DestinationPath "${{ matrix.archive_name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.archive_name }}
            dist/LuckyAgent-Setup-*.exe
            dist/*.deb
            dist/*.pkg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
