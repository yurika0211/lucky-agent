<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="public/favicon.png" />
  <title>LuckyAgent 部署知识库</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    window.tailwind = window.tailwind || {};
    window.tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'Microsoft YaHei', 'sans-serif']
          },
          colors: {
            ink: '#24313d',
            soft: '#f6f8f7',
            line: '#d8dfdc',
            paper: '#ffffff',
            graph: '#edf3ef',
            leaf: '#237452',
            river: '#2d6f93',
            clay: '#9a5f24',
            berry: '#9b4262'
          }
        }
      }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Roboto+Mono:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html {
      height: 100%;
      overflow: hidden;
      scroll-behavior: smooth;
    }
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      overflow-x: hidden;
    }
    .theme-light {
      --bg: #f6f4ec;
      --bg-soft: #f2f0e7;
      --panel: #f6f4ec;
      --line: #e2e1d9;
      --line-strong: #b7b5ac;
      --text: #1d1d1b;
      --muted: #6f6e69;
      --faint: #9a9891;
      --accent: #24837b;
      --accent-soft: rgba(36, 131, 123, .12);
      --warn: #bc5215;
      --code: #1b1f26;
      --code-text: #e9efe9;
    }
    .theme-dark {
      --bg: #13141c;
      --bg-soft: #1a1b26;
      --panel: #191a27;
      --line: #2a2c3d;
      --line-strong: #414868;
      --text: #c0c8e0;
      --muted: #8c91aa;
      --faint: #5d637c;
      --accent: #3aa99f;
      --accent-soft: rgba(58, 169, 159, .16);
      --warn: #da702c;
      --code: #0f1117;
      --code-text: #dce6df;
    }
    .theme-light,
    .theme-dark {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background .18s ease, color .18s ease;
    }
    .site-header {
      height: 50px;
      border-bottom: 1px solid var(--line);
      background: var(--bg);
    }
    .publish-shell {
      display: grid;
      grid-template-columns: 272px minmax(0, 1fr) 300px;
      min-width: 0;
      width: 100%;
      height: calc(100vh - 50px);
      min-height: calc(100vh - 50px);
      overflow: hidden;
    }
    .nav-rail {
      border-right: 1px solid var(--line);
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 26px 20px 48px;
      scrollbar-gutter: stable;
    }
    .article-column {
      border-right: 1px solid var(--line);
      min-height: 0;
      min-width: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 34px 48px 72px;
      scrollbar-gutter: stable;
    }
    .right-column {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 32px 24px;
      scrollbar-gutter: stable;
    }
    .nav-rail::-webkit-scrollbar,
    .article-column::-webkit-scrollbar,
    .right-column::-webkit-scrollbar {
      width: 12px;
    }
    .nav-rail::-webkit-scrollbar-track,
    .article-column::-webkit-scrollbar-track,
    .right-column::-webkit-scrollbar-track {
      background: var(--bg);
      border-left: 1px solid var(--line);
    }
    .nav-rail::-webkit-scrollbar-thumb,
    .article-column::-webkit-scrollbar-thumb,
    .right-column::-webkit-scrollbar-thumb {
      min-height: 48px;
      border: 3px solid var(--bg);
      border-radius: 999px;
      background: color-mix(in srgb, var(--muted) 58%, transparent);
    }
    .nav-rail::-webkit-scrollbar-thumb:hover,
    .article-column::-webkit-scrollbar-thumb:hover,
    .right-column::-webkit-scrollbar-thumb:hover {
      background: color-mix(in srgb, var(--muted) 72%, transparent);
    }
    .nav-group-title {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 6px;
      padding: 4px 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .nav-group-items {
      margin-top: 2px;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 4px;
      border-left: 2px solid transparent;
      padding: 6px 8px 6px 10px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.3;
      text-align: left;
    }
    .nav-item:hover {
      background: var(--bg-soft);
    }
    .nav-item-active {
      border-left-color: var(--accent);
      background: var(--accent-soft);
      font-weight: 600;
    }
    .hamburger-button {
      display: none;
    }
    .nav-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(0, 0, 0, .4);
    }
    .nav-drawer {
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 41;
      width: min(84vw, 320px);
      overflow-y: auto;
      background: var(--bg);
      border-right: 1px solid var(--line);
      padding: 20px 20px 48px;
      transform: translateX(-100%);
      transition: transform .2s ease;
    }
    .nav-drawer.nav-drawer-open {
      transform: translateX(0);
    }
    .outline-toggle {
      display: none;
    }
    .graph-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(0, 0, 0, .5);
    }
    .graph-modal {
      position: fixed;
      z-index: 51;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(92vw, 720px);
      max-height: 86vh;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 20px;
    }
    .graph-scope-toggle {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 2px;
      gap: 2px;
    }
    .graph-scope-option {
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 12px;
      color: var(--muted);
    }
    .graph-scope-option.graph-scope-active {
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 600;
    }
    .brand-mark {
      width: 28px;
      height: 28px;
    }
    .markdown-page h1 {
      margin: 0 0 42px;
      font-size: clamp(34px, 5vw, 42px);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: 0;
    }
    .markdown-page {
      overflow-wrap: anywhere;
    }
    .markdown-page h2 {
      margin: 38px 0 14px;
      font-size: 25px;
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .markdown-page p {
      margin: 0 0 18px;
      max-width: 620px;
      font-size: 17px;
      line-height: 1.5;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
    .markdown-page a,
    .link-button {
      color: var(--text);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
    }
    .publish-rule {
      margin: 36px 0 32px;
      border: 0;
      border-top: 1px solid var(--line);
    }
    .entry-card {
      min-height: 112px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--bg) 86%, white 14%);
      border-radius: 4px;
      padding: 12px 14px;
      text-align: left;
      transition: border-color .15s ease, background .15s ease;
    }
    .entry-card:hover {
      border-color: var(--line-strong);
      background: var(--bg-soft);
    }
    .note-section {
      scroll-margin-top: 74px;
    }
    .note-kicker {
      color: var(--muted);
      font-size: 13px;
    }
    .note-list li {
      margin: 8px 0;
      padding-left: 2px;
      color: var(--text);
      line-height: 1.55;
    }
    .note-list li::marker {
      color: var(--faint);
    }
    .publish-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
    }
    .publish-table th,
    .publish-table td {
      border: 1px solid var(--line);
      padding: 6px 10px;
      text-align: left;
      vertical-align: top;
    }
    .publish-table th {
      font-weight: 600;
    }
    .config-guide-intro {
      margin-top: 18px;
      border-left: 3px solid var(--accent);
      background: var(--accent-soft);
      padding: 14px 16px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      max-width: 100%;
      overflow-wrap: anywhere;
    }
    .config-guide-intro strong {
      font-weight: 600;
    }
    .config-guide-intro code {
      overflow-wrap: anywhere;
    }
    .config-guide-section {
      margin-top: 34px;
      scroll-margin-top: 18px;
    }
    .config-guide-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }
    .config-guide-section h3 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    .config-guide-section-head p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      text-align: right;
    }
    .config-guide-table-wrap {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
    }
    .config-guide-table {
      width: 100%;
      min-width: 680px;
      border-collapse: collapse;
      font-size: 13px;
    }
    .config-guide-table th,
    .config-guide-table td {
      border-bottom: 1px solid var(--line);
      padding: 9px 10px;
      text-align: left;
      vertical-align: top;
    }
    .config-guide-table tr:last-child td {
      border-bottom: 0;
    }
    .config-guide-table th {
      background: var(--bg-soft);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .config-guide-table th:first-child,
    .config-guide-table td:first-child {
      width: 28%;
    }
    .config-guide-table th:nth-child(2),
    .config-guide-table td:nth-child(2) {
      width: 27%;
    }
    .config-guide-table code {
      color: var(--accent);
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .config-guide-table td:last-child {
      color: var(--muted);
      line-height: 1.55;
    }
    .sidebar-title {
      color: var(--muted);
      font-size: 15px;
      font-weight: 400;
    }
    .search-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: transparent;
      padding: 8px 10px 8px 34px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--line-strong);
      box-shadow: 0 0 0 2px var(--accent-soft);
    }
    .graph-box {
      position: relative;
      height: 220px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: color-mix(in srgb, var(--bg) 92%, var(--accent) 8%);
    }
    .graph-box-lg {
      height: 480px;
      margin-top: 14px;
    }
    .mini-node {
      position: absolute;
      z-index: 2;
      display: flex;
      max-width: 92px;
      min-height: 28px;
      align-items: center;
      gap: 4px;
      border: 0;
      background: transparent;
      color: var(--text);
      font-size: 11px;
      line-height: 1.1;
      text-align: left;
      transform: translate(-50%, -50%);
      cursor: grab;
      touch-action: none;
    }
    .mini-node.dragging {
      cursor: grabbing;
      z-index: 4;
    }
    .graph-box-lg .mini-node {
      max-width: 120px;
      font-size: 12px;
    }
    .mini-node-label {
      max-width: 74px;
      overflow: hidden;
      text-overflow: clip;
    }
    .graph-box-lg .mini-node-label {
      max-width: 96px;
    }
    .mini-node-dot {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--bg) 76%, transparent);
    }
    .mini-node.active .mini-node-dot {
      width: 20px;
      height: 20px;
      background: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }
    .mini-node.active {
      z-index: 3;
      font-size: 12px;
      font-weight: 600;
    }
    .terminal {
      margin-top: 14px;
      border-radius: 4px;
      background: var(--code);
      color: var(--code-text);
      font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .terminal pre {
      margin: 0;
      overflow-x: auto;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.55;
    }
    .terminal code { white-space: pre-wrap; word-break: break-word; }
    .copy-button {
      border: 1px solid color-mix(in srgb, var(--code-text) 18%, transparent);
      border-radius: 4px;
      padding: 4px 8px;
      color: var(--code-text);
      font-size: 12px;
    }
    .tag-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border-radius: 4px;
      background: var(--bg-soft);
      padding: 2px 6px;
      color: var(--muted);
      font-size: 13px;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 50;
      transform: translateX(-50%);
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--text);
      color: var(--bg);
      padding: 8px 14px;
      font-size: 13px;
    }
    @media (max-width: 1180px) {
      .publish-shell { grid-template-columns: 240px minmax(0, 1fr) 270px; }
      .article-column {
        padding-left: 36px;
        padding-right: 36px;
      }
      .right-column {
        padding-left: 22px;
        padding-right: 22px;
      }
    }
    @media (max-width: 900px) {
      .publish-shell {
        display: block;
        width: 100%;
        min-width: 0;
        height: auto;
        overflow: visible;
      }
      html,
      body {
        height: auto;
        overflow: auto;
      }
      .nav-rail {
        display: none;
      }
      .hamburger-button {
        display: grid;
      }
      .article-column {
        height: auto;
        width: 100vw;
        max-width: 100vw;
        overflow: visible;
        border-top: 0;
        border-right: 0;
        padding: 24px 22px 34px;
      }
      .right-column {
        display: none;
        height: auto;
        border-top: 1px solid var(--line);
        padding: 20px 22px 42px;
      }
      .outline-toggle {
        display: flex;
        margin-bottom: 18px;
      }
      .shell-outline-open .right-column {
        display: block;
      }
      .site-header { height: auto; }
      .markdown-page h1 {
        margin-bottom: 32px;
        font-size: 33px;
      }
      .markdown-page h2 {
        margin-top: 32px;
        font-size: 23px;
      }
      .markdown-page p {
        font-size: 16px;
        line-height: 1.55;
      }
      .publish-rule {
        margin: 30px 0 28px;
      }
      .entry-card {
        min-height: 96px;
        padding: 12px 14px;
      }
      .graph-box {
        height: 240px;
      }
      .graph-modal {
        width: 94vw;
        max-height: 90vh;
        padding: 16px;
      }
      .graph-box-lg {
        height: 380px;
      }
      .config-guide-section-head {
        display: block;
      }
      .config-guide-section-head p {
        margin-top: 4px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div x-data="deploymentVault()" x-init="init()" :class="(dark ? 'theme-dark' : 'theme-light') + (outlineOpen ? ' shell-outline-open' : '')">
    <header class="site-header flex items-center justify-between px-5">
      <div class="flex items-center gap-3">
        <button type="button" @click="navOpen = true" class="hamburger-button h-8 w-8 place-items-center rounded border" style="border-color: var(--line); background: var(--panel); color: var(--text);" title="打开导航">
          <i data-lucide="menu" class="h-4 w-4"></i>
        </button>
        <a href="#home" @click.prevent="goHome()" class="flex items-center gap-4 text-sm font-semibold no-underline" style="color: var(--text);">
          <svg class="brand-mark" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <path d="M4 28L14 5L30 28H4Z" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"></path>
            <path d="M14 5V28" stroke="currentColor" stroke-width="2.2"></path>
            <path d="M14 19L25 28" stroke="currentColor" stroke-width="2.2"></path>
          </svg>
          <span>LuckyAgent Deploy Vault</span>
        </a>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" @click="graphOpen = true; ensureModalSim(); $nextTick(() => refreshIcons())" class="grid h-8 w-8 place-items-center rounded border" style="border-color: var(--line); background: var(--panel); color: var(--text);" title="Interactive Graph">
          <i data-lucide="network" class="h-4 w-4"></i>
        </button>
        <button type="button" @click="dark = !dark; $nextTick(() => refreshIcons())" class="grid h-8 w-8 place-items-center rounded border" style="border-color: var(--line); background: var(--panel); color: var(--text);" title="切换主题">
          <i :data-lucide="dark ? 'sun' : 'moon'" class="h-4 w-4"></i>
        </button>
      </div>
    </header>

    <div x-show="navOpen" x-transition.opacity @click="navOpen = false" class="nav-backdrop"></div>
    <nav class="nav-drawer" :class="navOpen ? 'nav-drawer-open' : ''">
      <div class="relative">
        <i data-lucide="search" class="pointer-events-none absolute left-3 top-2.5 h-4 w-4" style="color: var(--faint);"></i>
        <input id="nav-search-mobile" name="nav-search-mobile" x-model="query" class="search-input" type="search" placeholder="Search page or heading..." />
      </div>
      <template x-if="query.trim()">
        <div class="mt-4 space-y-1">
          <template x-for="item in visibleNotes()" :key="item.id">
            <button type="button" @click="jump(item.id)" class="nav-item w-full" :class="active === item.id ? 'nav-item-active' : ''">
              <i :data-lucide="item.icon" class="h-3.5 w-3.5"></i>
              <span x-text="item.title"></span>
            </button>
          </template>
          <template x-if="visibleNotes().length === 0">
            <p class="text-sm" style="color: var(--muted);">没有匹配节点</p>
          </template>
        </div>
      </template>
      <template x-if="!query.trim()">
        <div class="mt-4 space-y-4">
          <template x-for="group in groupedNotes()" :key="group.name">
            <div>
              <button type="button" class="nav-group-title" @click="toggleGroup(group.name)">
                <i :data-lucide="collapsedGroups.includes(group.name) ? 'chevron-right' : 'chevron-down'" class="h-3.5 w-3.5"></i>
                <span x-text="group.name"></span>
              </button>
              <div class="nav-group-items" x-show="!collapsedGroups.includes(group.name)">
                <template x-for="item in group.items" :key="item.id">
                  <button type="button" @click="jump(item.id)" class="nav-item w-full" :class="active === item.id ? 'nav-item-active' : ''">
                    <i :data-lucide="item.icon" class="h-3.5 w-3.5"></i>
                    <span x-text="item.title"></span>
                  </button>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>
    </nav>

    <div class="publish-shell">
      <nav class="nav-rail">
        <div class="relative">
          <i data-lucide="search" class="pointer-events-none absolute left-3 top-2.5 h-4 w-4" style="color: var(--faint);"></i>
          <input id="nav-search-desktop" name="nav-search-desktop" x-model="query" class="search-input" type="search" placeholder="Search page or heading..." />
        </div>
        <template x-if="query.trim()">
          <div class="mt-4 space-y-1">
            <template x-for="item in visibleNotes()" :key="item.id">
              <button type="button" @click="jump(item.id)" class="nav-item w-full" :class="active === item.id ? 'nav-item-active' : ''">
                <i :data-lucide="item.icon" class="h-3.5 w-3.5"></i>
                <span x-text="item.title"></span>
              </button>
            </template>
            <template x-if="visibleNotes().length === 0">
              <p class="text-sm" style="color: var(--muted);">没有匹配节点</p>
            </template>
          </div>
        </template>
        <template x-if="!query.trim()">
          <div class="mt-4 space-y-4">
            <template x-for="group in groupedNotes()" :key="group.name">
              <div>
                <button type="button" class="nav-group-title" @click="toggleGroup(group.name)">

    function stepGraphForces(nodes, links) {
      const centerX = 50;
      const centerY = 50;
      const repelStrength = 220;
      const springStrength = 0.02;
      const springLength = 26;
      const centerStrength = 0.006;
      const damping = 0.82;
      for (const node of nodes) {
        if (node.fx != null) { node.x = node.fx; node.y = node.fy; node.vx = 0; node.vy = 0; continue; }
        let fx = (centerX - node.x) * centerStrength;
        let fy = (centerY - node.y) * centerStrength;
        for (const other of nodes) {
          if (other === node) continue;
          let dx = node.x - other.x;
          let dy = node.y - other.y;
          let distSq = dx * dx + dy * dy;
          if (distSq < 0.01) { dx = (Math.random() - 0.5); dy = (Math.random() - 0.5); distSq = 0.01; }
          const force = repelStrength / distSq;
          const dist = Math.sqrt(distSq);
          fx += (dx / dist) * force;
          fy += (dy / dist) * force;
        }
        node.fx_ = fx;
        node.fy_ = fy;
      }
      for (const edge of links) {
        const a = edge.a;
        const b = edge.b;
        if (a.fx != null && b.fx != null) continue;
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
        const force = (dist - springLength) * springStrength;
        const ax = (dx / dist) * force;
        const ay = (dy / dist) * force;
        if (a.fx == null) { a.fx_ += ax; a.fy_ += ay; }
        if (b.fx == null) { b.fx_ -= ax; b.fy_ -= ay; }
      }
      let energy = 0;
      for (const node of nodes) {
        if (node.fx != null) continue;
        node.vx = (node.vx + node.fx_) * damping;
        node.vy = (node.vy + node.fy_) * damping;
        node.x = Math.min(94, Math.max(6, node.x + node.vx));
        node.y = Math.min(94, Math.max(6, node.y + node.vy));
        energy += node.vx * node.vx + node.vy * node.vy;
      }
      return energy;
    }

            y: 30,
            summary: 'README 的常用命令可以作为部署验证顺序，从初始化、配置、聊天、API 到网关启动。',
            points: [
              'lh init 初始化运行目录。',

            commands: [

        ],
        init() {
          const id = this.idFromHash();
          if (id && this.node(id).id) {
            this.active = id;
          }
          this.ensurePreviewSim();
          this.$nextTick(() => {
            this.refreshIcons();
            if (id) this.scrollTo(id, false);
          });
          window.addEventListener('hashchange', () => {
            const next = this.idFromHash();
            if (next && this.node(next).id) {
              this.active = next;
              this.ensurePreviewSim();
              if (this.graphOpen) this.ensureModalSim();
              this.$nextTick(() => this.scrollTo(next, false));
            }
          });
          window.addEventListener('keydown', (event) => {
            if (event.key !== 'Escape') return;
            this.navOpen = false;
            this.closeGraphModal();
          });
          window.addEventListener('pointermove', (event) => this.onNodePointerMove(event));
          window.addEventListener('pointerup', () => this.onNodePointerUp());
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
              this.stopSim(this.previewSim);
              this.stopSim(this.modalSim);
            } else {
              this.startSim(this.previewSim);
              if (this.graphOpen) this.startSim(this.modalSim);
            }
          });
        },
        refreshIcons() {
          if (window.lucide) window.lucide.createIcons();
        },
        idFromHash() {
          return decodeURIComponent(window.location.hash.replace(/^#note-/, '').replace(/^#/, ''));
        },
        node(id) {
          return this.notes.find((note) => note.id === id) || {};
        },
        current() {
          return this.node(this.active) || this.notes[0];
        },
        visibleNotes() {
          const q = this.query.trim().toLowerCase();
          if (!q) return this.notes;
          return this.notes.filter((note) => {
            const commands = (note.commands || []).map((cmd) => `${cmd.label} ${cmd.body}`).join(' ');
            const guide = (note.configGuide || []).map((section) => [
              section.title,
              section.description,
              ...(section.fields || []).flatMap((field) => [field.field, field.example, field.description])
            ].join(' ')).join(' ');
            return [note.title, note.short, note.group, note.summary, note.points.join(' '), commands, guide].join(' ').toLowerCase().includes(q);
          });
        },
        groupedNotes() {
          const groups = [];
          for (const note of this.visibleNotes()) {
            let group = groups.find((item) => item.name === note.group);
            if (!group) {
              group = { name: note.group, items: [] };
              groups.push(group);
            }
            group.items.push(note);
          }
          return groups;
        },
        entryCards() {
          return [
            { id: 'install-tui', title: '三端安装', description: 'Linux、Windows、macOS 安装后直接 lh tui' },
            { id: 'config', title: '配置入口', description: '先确认 HOME 和 config.json，再启动任何服务' },
            { id: 'prod-docker', title: '部署路径', description: '源码、开发 Compose、生产 Compose、镜像直跑' }
          ];
        },
        recentRows() {
          return [
            { id: 'overview', label: '部署地图' },
            { id: 'install-tui', label: '三端安装和 TUI' },
            { id: 'source', label: '源码运行' },
            { id: 'dev-docker', label: '开发 Docker' },
            { id: 'prod-docker', label: '生产 Docker' },
            { id: 'napcat', label: 'NapCat / OneBot v11' },
            { id: 'opencli', label: 'OpenCLI 网页读取' },
            { id: 'systemd', label: 'systemd 托管' },
            { id: 'troubleshooting', label: '排查路径' }
          ];
        },
        pageLinks() {
          const q = this.query.trim();
          const ids = q
            ? this.visibleNotes().map((note) => note.id)
            : ['overview', 'install-tui', 'config', 'config-reference', 'runtime', 'source', 'dev-docker', 'prod-docker', 'api', 'opencli', 'napcat', 'ops', 'troubleshooting', 'commands'];
          return ids.map((id) => this.node(id)).filter((note) => note.id);
        },
        articleSections() {
          const sections = [
            { id: 'article-top', title: currentTitle(this.current()) },
            { id: 'article-points', title: '要点' }
          ];
          if (this.current().configGuide && this.current().configGuide.length) {
            sections.push({ id: 'article-config-guide', title: '配置说明书' });
            for (const group of this.current().configGuide) {
              sections.push({ id: 'config-guide-' + group.id, title: group.title });
            }
          }
          sections.push({ id: 'article-links', title: '链接到' });
          if (this.current().commands && this.current().commands.length) {
            sections.push({ id: 'article-commands', title: '命令' });
          }
          if (this.active === 'overview') {
            sections.push({ id: 'article-entry', title: '快速入口' });
            sections.push({ id: 'article-deploy-table', title: '部署入口' });
          }
          return sections;
        },
        backlinks(id) {
          return this.notes.filter((note) => note.related && note.related.includes(id));
        },
        localNeighborIds() {
          const center = this.current();
          if (!center.id) return [];
          const ids = [];
          const push = (id) => {
            if (id && id !== center.id && this.node(id).id && !ids.includes(id)) ids.push(id);
          };
          for (const id of center.related || []) push(id);
          for (const note of this.backlinks(center.id)) push(note.id);
          return ids.slice(0, 10);
        },
        seedNodePosition(id, index, ring, useNoteCoords) {
          if (useNoteCoords) {
            const note = this.node(id);
            return { x: note.x != null ? note.x : 50, y: note.y != null ? note.y : 50 };
          }
          const radiusX = ring > 7 ? 36 : 32;
          const radiusY = ring > 7 ? 34 : 30;
          const angle = (-90 + (360 / Math.max(ring, 1)) * index) * Math.PI / 180;
          return { x: 50 + Math.cos(angle) * radiusX, y: 50 + Math.sin(angle) * radiusY };
        },
        syncSim(sim, ids, useNoteCoords) {
          const idSet = new Set(ids);
          sim.nodes = sim.nodes.filter((node) => idSet.has(node.id));
          const existingIds = new Set(sim.nodes.map((node) => node.id));
          const ring = ids.length - 1;
          ids.forEach((id, index) => {
            if (existingIds.has(id)) return;
            const note = this.node(id);
            if (!note.id) return;
            const isCenter = index === 0 && !useNoteCoords;
            const pos = isCenter ? { x: 50, y: 50 } : this.seedNodePosition(id, index - (useNoteCoords ? 0 : 1), ring, useNoteCoords);
            sim.nodes.push({ id, title: note.title, x: pos.x, y: pos.y, vx: 0, vy: 0, fx: null, fy: null });
          });
          const nodeById = {};
          for (const node of sim.nodes) nodeById[node.id] = node;
          if (useNoteCoords) {
            sim.links = this.edges
              .filter(([from, to]) => nodeById[from] && nodeById[to])
              .map(([from, to]) => ({ a: nodeById[from], b: nodeById[to] }));
          } else {
            const center = nodeById[ids[0]];
            sim.links = center ? ids.slice(1).filter((id) => nodeById[id]).map((id) => ({ a: center, b: nodeById[id] })) : [];
          }
        },
        startSim(sim) {
          if (sim.raf) return;
          sim.settleFrames = 0;
          const tick = () => {
            const energy = stepGraphForces(sim.nodes, sim.links);
            if (energy < 0.01) {
              sim.settleFrames += 1;
            } else {
              sim.settleFrames = 0;
            }
            if (sim.settleFrames > 90) {
              sim.raf = null;
              return;
            }
            sim.raf = requestAnimationFrame(tick);
          };
          sim.raf = requestAnimationFrame(tick);
        },
        stopSim(sim) {
          if (sim.raf) cancelAnimationFrame(sim.raf);
          sim.raf = null;
        },
        ensurePreviewSim() {
          this.syncSim(this.previewSim, [this.active, ...this.localNeighborIds()], false);
          this.startSim(this.previewSim);
        },
        edgeSvgFor(sim, highlightActive) {
          return sim.links.map((edge) => {
            if (!highlightActive) {
              return `<line x1="${edge.a.x}" y1="${edge.a.y}" x2="${edge.b.x}" y2="${edge.b.y}" stroke="currentColor" opacity=".3" stroke-width=".55" vector-effect="non-scaling-stroke"></line>`;
            }
            const activeEdge = edge.a.id === this.active || edge.b.id === this.active;
            const stroke = activeEdge ? 'rgba(35,116,82,.72)' : 'rgba(36,49,61,.28)';
            const width = activeEdge ? '.72' : '.42';
            return `<line x1="${edge.a.x}" y1="${edge.a.y}" x2="${edge.b.x}" y2="${edge.b.y}" stroke="${stroke}" stroke-width="${width}" vector-effect="non-scaling-stroke"></line>`;
          }).join('');
        },
        closeGraphModal() {
          this.graphOpen = false;
          this.stopSim(this.modalSim);
        },
        ensureModalSim() {
          if (this.graphScope === 'all') {
            this.syncSim(this.modalSim, this.notes.map((note) => note.id), true);
          } else {
            this.syncSim(this.modalSim, [this.active, ...this.localNeighborIds()], false);
          }
          this.startSim(this.modalSim);
        },
        graphBoxRect(event) {
          const box = event.target.closest('.graph-box');
          return box ? box.getBoundingClientRect() : null;
        },
        nodePointerDown(event, sim, id, closeOnClick) {
          const rect = this.graphBoxRect(event);
          if (!rect) return;
          event.preventDefault();
          event.stopPropagation();
          event.target.closest('.mini-node').setPointerCapture(event.pointerId);
          this.draggingNode = { sim, id, closeOnClick, rect, startX: event.clientX, startY: event.clientY, moved: false };
          this.startSim(sim);
        },
        onNodePointerMove(event) {
          const drag = this.draggingNode;
          if (!drag) return;
          const node = drag.sim.nodes.find((n) => n.id === drag.id);
          if (!node) return;
          const dx = event.clientX - drag.startX;
          const dy = event.clientY - drag.startY;
          if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
          const px = ((event.clientX - drag.rect.left) / drag.rect.width) * 100;
          const py = ((event.clientY - drag.rect.top) / drag.rect.height) * 100;
          node.fx = Math.min(94, Math.max(6, px));
          node.fy = Math.min(94, Math.max(6, py));
        },
        onNodePointerUp() {
          const drag = this.draggingNode;
          if (!drag) return;
          const node = drag.sim.nodes.find((n) => n.id === drag.id);
          if (node) {
            node.vx = 0;
            node.vy = 0;
            if (!drag.moved) { node.fx = null; node.fy = null; }
          }
          if (!drag.moved) {
            this.jump(drag.id);
            if (drag.closeOnClick) this.closeGraphModal();
          }
          this.draggingNode = null;
        },
        jump(id) {
          if (!this.node(id).id) return;
          this.active = id;
          this.navOpen = false;
          this.outlineOpen = false;
          history.replaceState(null, '', '#note-' + encodeURIComponent(id));
          this.ensurePreviewSim();
          if (this.graphOpen) this.ensureModalSim();
          this.$nextTick(() => {
            this.refreshIcons();
            this.scrollTo(id, true);
          });
        },
        goHome() {
          this.jump('overview');
        },
        toggleOutline() {
          this.outlineOpen = !this.outlineOpen;
          if (this.outlineOpen) {
            this.$nextTick(() => {
              if (this.$refs.rightColumn) {
                this.$refs.rightColumn.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }
            });
          }
        },
        toggleGroup(name) {
          const index = this.collapsedGroups.indexOf(name);
          if (index === -1) {
            this.collapsedGroups.push(name);
          } else {
            this.collapsedGroups.splice(index, 1);
          }
          this.$nextTick(() => this.refreshIcons());
        },
        scrollTo(id, smooth) {
          const article = this.$refs.articleColumn;
          if (!article) return;
          if (window.matchMedia('(max-width: 900px)').matches) {
            article.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
          } else {
            article.scrollTo({ top: 0, behavior: smooth ? 'smooth' : 'auto' });
          }
        },
        scrollArticleSection(id) {
          const article = this.$refs.articleColumn;
          const el = document.getElementById(id);
          if (!article || !el) return;
          const top = article.scrollTop + el.getBoundingClientRect().top - article.getBoundingClientRect().top;
          article.scrollTo({ top: Math.max(0, top - 8), behavior: 'smooth' });
          this.outlineOpen = false;
        },
        async copyText(value) {
          try {
            await navigator.clipboard.writeText(value);
          } catch (err) {
            const area = document.createElement('textarea');
            area.value = value;
            document.body.appendChild(area);
            area.select();
            document.execCommand('copy');
            area.remove();
          }
          this.copied = true;
          window.setTimeout(() => { this.copied = false; }, 1200);
        },
        copyNoteLink(id) {
          const url = window.location.href.split('#')[0] + '#note-' + encodeURIComponent(id);
          this.copyText(url);
        }
      };
    }

    function currentTitle(note) {
      return note && note.title ? note.title : '当前文章';
    }
  </script>
